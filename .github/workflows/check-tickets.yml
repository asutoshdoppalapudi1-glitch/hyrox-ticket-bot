name: HYROX USA Ticket Watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Never let two runs of this workflow execute at the same time - that's
# what was causing the "fetch first" push error.
concurrency:
  group: hyrox-ticket-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ticket check
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python check_tickets.py

      - name: Commit updated state
        run: |
          git config user.name "hyrox-ticket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ticket state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No state changes to commit."
          fi
